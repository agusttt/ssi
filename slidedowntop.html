<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vertical Slider</title>
<link rel="stylesheet" href="assets/css/style.css">

<style>
.container {
  padding: 120px;
}
.wslider-tdown {
  width: 259px;
  height: 259px;
  overflow: hidden;
  position: relative;
}
.slidesv-tdown {
  display: flex;
  flex-direction: column-reverse;
  transition: transform 0.5s ease-in-out;
  position: absolute;
  width: 100%;
}
.slidevsatu-tdown {
  width: 100%;
  height: 259px;
  background-size: cover;
  background-position: center;
}
</style>
</head>
<body>
<div class="container">
  <div class="wslider-tdown">
    <div class="slidesv-tdown">
      <div class="slidevsatu-tdown" style="background-image: url('assets/images/cr-3-image-medium-2.jpg');"></div>
      <div class="slidevsatu-tdown" style="background-image: url('assets/images/cr-3-image-medium-2-2.jpg');"></div>
      <div class="slidevsatu-tdown" style="background-image: url('assets/images/cr-3-image-medium-2-3.jpg');"></div>
    </div>
  </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const slidesContainer = document.querySelector(".slidesv-tdown");
  const slides = document.querySelectorAll(".slidevsatu-tdown");
  const slideHeight = slides[0].offsetHeight;
  let currentSlide = 0;

  // Clone first and last slide for infinite effect
  const firstClone = slides[0].cloneNode(true);
  const lastClone = slides[slides.length - 1].cloneNode(true);
  slidesContainer.appendChild(firstClone);
  slidesContainer.insertBefore(lastClone, slides[0]);

  slidesContainer.style.transform = `translateY(-${slideHeight}px)`;
  currentSlide = 1;

  function nextSlide() {
    currentSlide++;
    slidesContainer.style.transition = "transform 0.5s ease-in-out";
    slidesContainer.style.transform = `translateY(-${currentSlide * slideHeight}px)`;
    
    if (currentSlide >= slides.length) {
      setTimeout(() => {
        slidesContainer.style.transition = "none";
        slidesContainer.style.transform = `translateY(-${slideHeight}px)`;
        currentSlide = 1;
      }, 500);
    }
  }

  setInterval(nextSlide, 3000);
});
</script>
</body>
</html>
