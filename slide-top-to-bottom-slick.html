<style>
.slick-prev, .slick-next {
    position: absolute;
    transform: translateX(-50%);
    background-color: rgba(0, 0, 0, 0.8);
    color: white;
    border: none;
    padding: 10px 20px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    z-index: 1000; /* Pastikan tombol berada di atas slider */
    display: block !important; /* Paksa tombol agar terlihat */
}

.slick-prev { left: 0; }  /* Tombol "Prev" di atas slider */
.slick-next { right: 0; } /* Tombol "Next" di bawah slider */

.slick-prev:hover, .slick-next:hover {
    background-color: rgba(0, 0, 0, 1);
}

</style>

			nextArrow: '<button class="slick-next">Next</button>',			
		});
	});
</script>
